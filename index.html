<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOPASS</title><style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#fff}#loading{height:100%;display:grid;place-items:center;color:#635bff;font-weight:800}</style></head><body><div id="loading">LOOPASS 불러오는 중...</div><script>(async()=>{try{const base='loopass_v31_0811/index/';const n=12;const parts=await Promise.all(Array.from({length:n},(_,i)=>fetch(base+'c'+String(i).padStart(2,'0')+'.txt').then(r=>{if(!r.ok)throw Error('chunk '+i);return r.text()})));const s=parts.join('').replace(/\s+/g,'');const bin=atob(s),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px">LOOPASS load error: '+String(e)+'</pre>'}})();</script></body></html>
